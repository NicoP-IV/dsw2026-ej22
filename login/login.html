<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedPortal - Iniciar Sesión</title>
  <link rel="stylesheet" href="login_style.css">

  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="login-container">
    <div class="login-brand">
      <span class="logo"><i data-lucide="shield-plus"></i></span>
      <h1>MedPortal</h1>
    </div>

    <div class="login-card">
      <form>
        <p class="welcome">Bienvenido de nuevo</p>
        <p class="hint">Por favor, autentíquese para acceder al portal de proveedores.</p>

        <label for="username">Nombre de usuario</label>
        <div class="input-group">
          <i data-lucide="circle-user"></i>
          <input type="text" id="username" placeholder="Ingrese ID de admin" required>
        </div>

        <label for="password">Contraseña</label>
        <div class="input-group">
          <i data-lucide="lock"></i>
          <input type="password" id="password" placeholder="••••••••" required>
          <button type="button" id="toggle-password" aria-label="Mostrar contraseña">
            <i data-lucide="eye"></i>
          </button>
        </div>

        <button type="submit" class="btn-login">Iniciar Sesión <i data-lucide="log-in"></i></button>
      </form>

      <div class="notice">
        <i data-lucide="shield-check"></i>
        <p><strong>Solo Acceso Seguro:</strong> Este sistema es para personal médico autorizado. Los intentos de acceso no autorizados son registrados y monitoreados para su cumplimiento.</p>
      </div>
    </div>

  </div>

  <script src="login.js"></script>
</body>
</html>
