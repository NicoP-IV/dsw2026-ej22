<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medical Center - Admin</title>
  <link rel="stylesheet" href="menu.css">
</head>
<body>

  <!-- ============================================================
       BARRA SUPERIOR
       Solo se ve en celulares (en pantalla grande se oculta con CSS).
       Tiene el botón ☰ que abre/cierra el menú.
       ============================================================ -->
  <header class="topbar">
    <button id="menu-toggle" class="menu-toggle" aria-label="Abrir menú">
      <!-- 3 rayitas del ícono hamburguesa -->
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
    <span class="topbar__title">Medical Center</span>
  </header>

  <!-- ============================================================
       MENÚ LATERAL (sidebar)
       En pantalla grande está siempre a la izquierda.
       En celular queda oculto y aparece al tocar el botón ☰.
       ============================================================ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__brand">
      <span class="sidebar__logo" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L4 6v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V6l-8-4z" fill="currentColor"/>
        </svg>
      </span>
      <div class="sidebar__brand-text">
        <span class="sidebar__brand-name">Medical Center</span>
        <span class="sidebar__brand-sub">Admin Portal</span>
      </div>
    </div>

    <nav class="sidebar__nav" aria-label="Navegación principal">
      <ul>
        <li>
          <a href="#" data-nav="dashboard">
            <span class="sidebar__icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <rect x="3" y="3" width="7" height="9" rx="1.5"/>
                <rect x="14" y="3" width="7" height="5" rx="1.5"/>
                <rect x="14" y="12" width="7" height="9" rx="1.5"/>
                <rect x="3" y="16" width="7" height="5" rx="1.5"/>
              </svg>
            </span>
            <span>Panel de administración</span>
          </a>
        </li>
        <li>
          <a href="#" data-nav="doctors">
            <span class="sidebar__icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M20 21a8 8 0 0 0-16 0"/>
                <circle cx="12" cy="8" r="4.2"/>
              </svg>
            </span>
            <span>Doctors</span>
          </a>
        </li>
        <li>
          <a href="#" data-nav="specialties">
            <span class="sidebar__icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M12 2l3 6.5L22 9.5l-5 4.9 1.2 6.9L12 18l-6.2 3.3L7 14.4 2 9.5l7-1z"/>
              </svg>
            </span>
            <span>Specialties</span>
          </a>
        </li>
        <li>
          <a href="#" data-nav="patient-search">
            <span class="sidebar__icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <circle cx="10.5" cy="10.5" r="6.5"/>
                <path d="M20 20l-4.6-4.6"/>
              </svg>
            </span>
            <span>Patient Search</span>
          </a>
        </li>
      </ul>
    </nav>

    <div class="sidebar__footer">
      <a href="#" class="sidebar__footer-link" data-nav="help">
        <span class="sidebar__icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="12" r="9"/>
            <path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.9.4-1.5 1-1.5 2.2"/>
            <path d="M12 17h.01"/>
          </svg>
        </span>
        <span>Help Center</span>
      </a>
      <button type="button" class="sidebar__footer-link sidebar__logout" id="logout-btn">
        <span class="sidebar__icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <path d="M16 17l5-5-5-5"/>
            <path d="M21 12H9"/>
          </svg>
        </span>
        <span>Logout</span>
      </button>

      <div class="sidebar__user">
        <span class="sidebar__avatar" aria-hidden="true">A</span>
        <div class="sidebar__user-text">
          <span class="sidebar__user-name">Admin User</span>
          <span class="sidebar__user-role">Super Administrator</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- Fondo oscuro que aparece detrás del menú abierto en celular -->
  <div class="sidebar__scrim" id="sidebar-scrim" hidden></div>

  <!-- El JavaScript va al final para que el HTML ya exista cuando corre -->
  <script src="menu.js"></script>
</body>
</html>
